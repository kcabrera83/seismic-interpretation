site_name: Seismic Interpretation
site_description: Seismic facies classification and horizon picking automation.
repo_url: https://github.com/kcabrera83/seismic-interpretation
site_author: Kelvin J Cabrera

theme:
  name: material
  palette:
    primary: indigo
    accent: blue
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top

nav:
  - Home: index.md
  - API Reference: api.md
  - Models: models.md

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
